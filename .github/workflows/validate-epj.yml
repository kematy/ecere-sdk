name: Validate project files

on:
  push:
  pull_request:

jobs:
  validate-epj:
    name: Validate .epj JSON
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Validate .epj project files
        run: python3 scripts/validate-epj.py .

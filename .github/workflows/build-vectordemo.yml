name: Build VectorDemo

on:
  push:
  pull_request:

jobs:
  build-vectordemo:
    name: Build SDK and VectorDemo
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential make \
            zlib1g-dev libpng-dev libjpeg-dev libgif-dev \
            libncurses-dev libfreetype6-dev \
            libx11-dev libxrender-dev libgl1-mesa-dev libxext-dev \
            libsqlite3-dev libffi-dev libfontconfig1-dev \
            libcurl4-openssl-dev

      - name: Build Ecere SDK
        run: make -j"$(nproc)" DISABLE_SSL=y ECERE_AUDIO=n

      - name: Build VectorDemo
        working-directory: samples/guiAndGfx/VectorDemo
        env:
          LIBRARY_PATH: ${{ github.workspace }}/obj/linux/lib
          LD_LIBRARY_PATH: ${{ github.workspace }}/obj/linux/lib
        run: |
          export PATH="${{ github.workspace }}/obj/linux/bin:$PATH"
          epj2make -o VectorDemo.Makefile VectorDemo.epj
          make -f VectorDemo.Makefile
          test -f obj/debug.linux/VectorDemo

      - name: Build DXFRoundTrip
        working-directory: tools/dxf-roundtrip
        env:
          LIBRARY_PATH: ${{ github.workspace }}/obj/linux/lib
          LD_LIBRARY_PATH: ${{ github.workspace }}/obj/linux/lib
        run: |
          export PATH="${{ github.workspace }}/obj/linux/bin:$PATH"
          epj2make -o DXFRoundTrip.Makefile DXFRoundTrip.epj
          make -f DXFRoundTrip.Makefile
          test -f obj/debug.linux/DXFRoundTrip

      - name: Validate DXF fixture
        run: python3 scripts/validate-dxf-fixture.py samples/guiAndGfx/VectorDemo/sample.dxf

      - name: Validate DXF round-trip
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/obj/linux/lib
        run: |
          export PATH="${{ github.workspace }}/obj/linux/bin:$PATH"
          ROUNDTRIP="$(mktemp /tmp/roundtrip-XXXXXX.dxf)"
          tools/dxf-roundtrip/obj/debug.linux/DXFRoundTrip samples/guiAndGfx/VectorDemo/sample.dxf "$ROUNDTRIP"
          python3 scripts/validate-dxf-roundtrip.py samples/guiAndGfx/VectorDemo/sample.dxf "$ROUNDTRIP" --fail-above 1e-9
